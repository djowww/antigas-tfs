# Install as /etc/systemd/system/imperium772.service.d/security-hardening.conf
[Service]
# The game listens only on high ports and needs no Linux capabilities.
CapabilityBoundingSet=
AmbientCapabilities=

# Keep the daemon's writable surface inside its own server tree and private /tmp.
ProtectSystem=strict
ReadWritePaths=/opt/imperium772/server

# Restrict host-facing operations unused by the game server.
PrivateDevices=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
