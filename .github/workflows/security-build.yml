name: Security and regression builds

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  cpp-build:
    name: C++ build and core tests (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: release
            os: ubuntu-24.04
          - mode: release-hardened
            os: ubuntu-22.04
          - mode: asan-ubsan
            os: ubuntu-24.04
          - mode: tsan
            os: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config \
            libboost-system-dev libboost-filesystem-dev \
            libluajit-5.1-dev luajit libpugixml-dev \
            libmariadb-dev libmariadb-dev-compat libgmp-dev

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.mode }}' in
            release)
              build_type=Release
              sanitizer_flags=''
              compile_flags=''
              linker_flags=''
              ;;
            release-hardened)
              build_type=Release
              sanitizer_flags=''
              compile_flags='-fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIE'
              linker_flags='-pie -Wl,-z,relro,-z,now'
              ;;
            asan-ubsan)
              build_type=Debug
              sanitizer_flags='-fsanitize=address,undefined -fno-omit-frame-pointer -g'
              compile_flags="$sanitizer_flags"
              linker_flags="$sanitizer_flags"
              ;;
            tsan)
              build_type=Debug
              sanitizer_flags='-fsanitize=thread -fno-omit-frame-pointer -g'
              compile_flags="$sanitizer_flags"
              linker_flags="$sanitizer_flags"
              ;;
          esac
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$build_type" \
            -DTFS_BUILD_RARITY_TESTS=ON \
            -DTFS_BUILD_LUA_WATCHDOG_TESTS=ON \
            -DTFS_BUILD_LUA_ENVIRONMENT_LIFECYCLE_TESTS=ON \
            -DTFS_BUILD_STATUS_QUERY_TESTS=ON \
            -DTFS_BUILD_SCHEDULER_TESTS=ON \
            -DTFS_BUILD_SCRIPT_READER_TESTS=ON \
            -DTFS_BUILD_SCRIPT_ENVIRONMENT_INDEX_TESTS=ON \
            -DTFS_BUILD_CONNECTION_OUTPUT_QUEUE_TESTS=ON \
            -DTFS_BUILD_CONNECTION_ADMISSION_TESTS=ON \
            -DTFS_BUILD_LOGIN_GATE_TESTS=ON \
            -DTFS_BUILD_DISPATCHER_FAILFAST_TESTS=ON \
            -DTFS_BUILD_SQL_IDENTIFIER_TESTS=ON \
            -DTFS_BUILD_SCRIPT_FILENAME_TESTS=ON \
            -DTFS_BUILD_LOCALTIME_TESTS=ON \
            -DTFS_BUILD_NETWORKMESSAGE_TESTS=ON \
            -DCMAKE_CXX_FLAGS="$compile_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$linker_flags"

      - name: Build server and core regression tests
        run: cmake --build build --parallel 2

      - name: Run native core tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      - name: Upload tested Ubuntu 22.04 production binary
        if: matrix.mode == 'release-hardened'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: antigas-tfs-linux-ubuntu-22.04-${{ github.sha }}
          path: build/tfs
          if-no-files-found: error
          retention-days: 7

  content-tests:
    name: PHP, Lua and Python regression checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install LuaJIT syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luajit php-cli

      - name: Parse tracked PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z -- '*.php')

      - name: Test safe translated HTML
        run: php tests/site-html-safety-tests.php

      - name: Parse tracked Lua scripts and persisted data
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if [[ "$file" == "data/globalevents/lib/lamp_states.lua" ]]; then
              # This file stores a bare table constructor, not a Lua chunk. Wrap it as an expression without executing it.
              wrapper="$RUNNER_TEMP/lamp-states-syntax-check.lua"
              { printf 'return '; cat "$file"; } > "$wrapper"
              luajit -b "$wrapper" /dev/null
            else
              luajit -b "$file" /dev/null
            fi
          done < <(git ls-files -z -- '*.lua')

      - name: Run Economy inventory regression tests
        run: luajit tests/economy-inventory-tests.lua

      - name: Run persisted lamp-state parser regression tests
        run: luajit tests/lamp-state-parser-tests.lua

      - name: Run rarity, Market inventory and economy regression tests
        run: luajit tests/rarity-economy-tests.lua

      - name: Run safe Python regression tests
        env:
          PYTHONPATH: tests
        run: python3 -m unittest test_load_test test_staging_safety test_recovery_script test_database_task_thread_affinity test_scheduler_lifetime test_report_bug_path test_coin_page_cache test_dispatcher_shutdown_order test_connection_shutdown_serialization test_connection_admission test_lamp_state_parser test_deployment_preconditions test_connection_output_queue test_sql_identifier test_script_filename -v

      - name: Parse tracked Python files
        run: |
          python3 - <<'PY'
          import ast
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py']).decode().split('\0')
          for path in filter(None, paths):
              with open(path, encoding='utf-8-sig') as source:
                  ast.parse(source.read(), filename=path)
          print(f'Parsed {sum(bool(path) for path in paths)} Python files')
          PY

  protocol-fuzz:
    name: Protocol parser fuzz smoke (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install fuzzer and server headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang libclang-rt-dev cmake pkg-config \
            libboost-system-dev libboost-filesystem-dev \
            libluajit-5.1-dev luajit libpugixml-dev \
            libmariadb-dev libmariadb-dev-compat libgmp-dev

      - name: Configure Clang/libFuzzer target
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DTFS_BUILD_PROTOCOL_FUZZER=ON

      - name: Build packet fuzzer
        run: cmake --build build --target protocol-input-fuzzer --parallel 2

      - name: Fuzz packet cursor and walking parser
        run: |
          set -euo pipefail
          mkdir -p build/fuzz-corpus build/fuzz-artifacts
          printf '\x02\x00\x00\x01\x08' > build/fuzz-corpus/valid-walk
          printf '\x02\x00\x00\x01' > build/fuzz-corpus/truncated-walk
          printf '\x01\x10\x00' > build/fuzz-corpus/over-limit-count
          printf '\x01\x00\x02' > build/fuzz-corpus/cursor-past-end
          ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ./build/protocol-input-fuzzer build/fuzz-corpus \
              -max_total_time=30 -max_len=65500 -timeout=2 \
              -artifact_prefix=build/fuzz-artifacts/

      - name: Preserve crash inputs and mutated corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: protocol-fuzz-failure-corpus
          path: |
            build/fuzz-artifacts/
            build/fuzz-corpus/
          if-no-files-found: ignore

  launcher-build:
    name: Windows launcher and release signer
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build launcher
        run: dotnet build deploy/launcher/AntigasLauncher/AntigasLauncher.csproj --configuration Release

      - name: Build release signer
        run: dotnet build tools/ReleaseSigner/ReleaseSigner.csproj --configuration Release

      - name: Test bounded launcher manifest reads
        run: dotnet run --project tests/LauncherSafetyTests.csproj --configuration Release

      - name: Test updater window lifecycle
        run: dotnet run --project tests/LauncherFormLifecycle/LauncherFormLifecycle.csproj --configuration Release

      - name: Build opt-in signed launcher integration harness
        run: dotnet build tests/LauncherIntegration/LauncherIntegration.csproj --configuration Release
